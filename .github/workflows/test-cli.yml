name: Test CLI
on:
 pull_request:
  branches:
    - 'master'
    - 'ci'

jobs:
  test-cli-yarn:
    name: "Test CLI (Yarn)"
    env:
      NODE_ENV: CI
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: "postgres://postgres:postgres@localhost/cli-test"
      POSTGRES_URL: "postgres://postgres:postgres@localhost/cli-test"
      # Placeholders, not secrets: the Stripe provider and the Resend client
      # refuse to load without a key, and nothing in this job calls them.
      STRIPE_API_KEY: sk_test_ci_placeholder
      RESEND_API_KEY: re_ci_placeholder
      SALES_COMMISSION_FX_FETCH: "false"
    services:
      redis:
        image: redis
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
 
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: cli-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.11.0
        with:
          access_token: ${{ github.token }}

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: 20
  
      # The repo pins Yarn 3 (`packageManager`); the runner's global Yarn is 1.
      - name: Enable Corepack
        run: corepack enable

      - name: Install Dependencies
        run: yarn install --immutable

      - name: Check CLI tool is installed
        run: ./node_modules/.bin/medusa -v

      - name: run build
        run: yarn build

      - name: Run migrations
        run: npx medusa db:migrate

      - name: Run seed
        run: yarn seed

      - name: Run development server
        run: yarn dev &

      - name: Wait for live server response
        shell: "bash"
        run: ./.github/scripts/wait-for-server-live.sh

      - name: Kill server
        shell: "bash"
        run: kill -9 $(lsof -t -i :9000)
